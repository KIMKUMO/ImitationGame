name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - claude/repo-permissions-check-k9xenj
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 덱 검증(C1~C5) + 엔진 검증 28건. 여기서 실패하면 배포하지 않는다.
      - name: Test
        run: npm test

      # dist/ 에 브라우저가 요청하는 파일만 모은다 (번들러 없음)
      - name: Build
        run: npm run build

      # wrangler 는 위 npm ci 로 이미 설치된 버전(devDependencies)을 그대로 쓴다.
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
