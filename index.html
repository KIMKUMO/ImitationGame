<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello Score App</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
  }
  .card {
    text-align: center;
    padding: 3rem 4rem;
    border-radius: 16px;
    background: #ffffff;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
  }
  h1 {
    margin: 0 0 1.5rem;
    font-size: 1.25rem;
    color: #555;
    font-weight: 500;
  }
  #score {
    font-size: 4rem;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 2rem;
  }
  button {
    font-size: 1.25rem;
    padding: 0.75rem 2.5rem;
    border: none;
    border-radius: 999px;
    background: #2563eb;
    color: #fff;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover {
    background: #1d4ed8;
  }
  button:active {
    transform: scale(0.96);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Score</h1>
    <div id="score">0</div>
    <button id="hello-btn">Hello</button>
  </div>

  <script>
    let score = 0;
    const scoreEl = document.getElementById('score');
    const btn = document.getElementById('hello-btn');

    btn.addEventListener('click', () => {
      score += 1;
      scoreEl.textContent = score;
    });
  </script>
</body>
</html>
